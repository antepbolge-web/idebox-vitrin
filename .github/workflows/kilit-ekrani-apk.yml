name: Kilit Ekrani APK

on:
  workflow_dispatch:
  push:
    branches:
      - ccr-572693b6-jjl7iy
    paths:
      - 'kilit-ekrani/**'
      - '.github/workflows/kilit-ekrani-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazirla
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: APK derle
        working-directory: kilit-ekrani
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kilit-ekrani-apk
          path: kilit-ekrani/app/build/outputs/apk/debug/app-debug.apk

      - name: APK adini duzenle
        run: cp kilit-ekrani/app/build/outputs/apk/debug/app-debug.apk kilit-ekrani.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: kilit-ekrani-v${{ github.run_number }}
          name: Kilit Ekrani v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: kilit-ekrani.apk
